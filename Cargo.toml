[package]
name = "user-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "user_service"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Async trait
async-trait = "0.1"

# Crypto
bcrypt = "0.17"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# IDs / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Env config
dotenvy = "0.15"

# Cookie handling
cookie = "0.18"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
